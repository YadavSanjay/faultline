<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 890" width="1040" height="890" role="img" aria-labelledby="t d">
<title id="t">Faultline architecture</title>
<desc id="d">Free public data sources feed 11 market-data pipelines and a data-quality gate, producing a content-addressed market-data snapshot. The pricer (input, loader, QuantLib, PricingEngine, results store) prices the book, with risk, portfolio construction and governance built on it. Scenario generation (static, dual-RAG or agentic-LLM drivers, using the external MacroRAG, XbrlRag and LLM services) reprices shocked books through the pricing engine. All outputs go through a local-or-S3 storage facade to a FastAPI BFF and React UI. Every result carries run provenance and snapshot ids.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs>
<style>
